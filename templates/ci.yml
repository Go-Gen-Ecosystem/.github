# Per-module CI caller. Copy to <module>/.github/workflows/ci.yml
# and set the module's coverage threshold (security 75, go-gen 60, others 70).
#
# @author Admilson B. F. Cossa
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: go-gen-ecosystem/.github/.github/workflows/reusable-go-ci.yml@main
    with:
      coverage-threshold: 70
