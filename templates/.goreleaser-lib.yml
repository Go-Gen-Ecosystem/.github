# GoReleaser template for library modules (framework, observer, resilience, security).
# Copy to <module>/.goreleaser.yml. Libraries ship no binaries — changelog + release only.
#
# @author Admilson B. F. Cossa
version: 2

before:
  hooks:
    - go mod tidy
    - go mod verify
    - go test ./...

builds:
  - skip: true

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other Changes
      order: 999
  filters:
    exclude:
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
